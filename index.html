<script>
/* Si el navegador guarda una copia vieja de esta página, se compara con la
   versión publicada (version.txt, sin caché) y se recarga la actual. */
(function () {
  var ESM_VERSION = '20260925101550';
  if (!window.fetch || location.protocol === 'file:') return;
  fetch('version.txt?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.text() : ''; })
    .then(function (t) {
      t = t.trim();
      if (!t || t === ESM_VERSION) return;
      try { if (sessionStorage.getItem('esm-reload') === t) return; sessionStorage.setItem('esm-reload', t); } catch (e) { return; }
      location.replace(location.pathname + '?v=' + t + location.hash);
    })
    .catch(function () {});
})();
</script>
